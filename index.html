<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis PAI – Fikih, Sejarah & Aqidah</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a304a;
    --accent: #c9a84c;
    --accent2: #e8c97a;
    --green: #3ecf7a;
    --red: #f04a5e;
    --text: #e8e8f0;
    --muted: #7a7f9a;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG decoration */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── SCREENS ── */
  .screen { display: none; position: relative; z-index: 1; }
  .screen.active { display: block; }

  /* ── START SCREEN ── */
  #start-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  #start-screen.active { display: flex; }

  .badge {
    display: inline-block;
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--accent2);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 50px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.2;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #e8e8f0 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    max-width: 480px;
    line-height: 1.7;
    margin-bottom: 48px;
  }

  .stats-row {
    display: flex;
    gap: 16px;
    margin-bottom: 48px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 28px;
    text-align: center;
    min-width: 120px;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--accent2);
    display: block;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .soal-picker {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 460px;
    margin-bottom: 24px;
  }
  .soal-picker label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(201,168,76,0.2);
    transition: box-shadow .2s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 8px rgba(201,168,76,0.15);
  }
  .slider-val {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--accent2);
    min-width: 48px;
    text-align: right;
  }

  .quick-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
  }
  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent2);
    background: rgba(201,168,76,0.08);
  }

  .btn-primary {
    background: var(--accent);
    color: #0f1117;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 16px 48px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    letter-spacing: .5px;
    transition: all .25s;
    box-shadow: 0 4px 24px rgba(201,168,76,0.25);
  }
  .btn-primary:hover {
    background: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(201,168,76,0.35);
  }
  .btn-primary:active { transform: translateY(0); }

  /* ── QUIZ SCREEN ── */
  #quiz-screen {
    min-height: 100vh;
    padding: 24px 16px 80px;
    max-width: 720px;
    margin: 0 auto;
  }
  #quiz-screen.active { display: block; }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .progress-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .soal-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--accent2);
  }
  .soal-total { color: var(--muted); font-size: 14px; }

  .score-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 13px;
    display: flex;
    gap: 12px;
  }
  .score-badge span { color: var(--muted); }
  .score-badge b { color: var(--green); }
  .score-badge .wrong { color: var(--red); }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .4s ease;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .bank-tag {
    display: inline-block;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    transition: all .2s;
    text-align: left;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(201,168,76,0.5);
    background: rgba(201,168,76,0.05);
  }
  .option-key {
    min-width: 28px; height: 28px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
    transition: all .2s;
  }
  .option-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    padding-top: 2px;
  }

  /* States */
  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(201,168,76,0.08);
  }
  .option-btn.selected .option-key {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1117;
  }
  .option-btn.correct {
    border-color: var(--green) !important;
    background: rgba(62,207,122,0.07) !important;
  }
  .option-btn.correct .option-key {
    background: var(--green) !important;
    border-color: var(--green) !important;
    color: #0f1117 !important;
  }
  .option-btn.wrong {
    border-color: var(--red) !important;
    background: rgba(240,74,94,0.07) !important;
  }
  .option-btn.wrong .option-key {
    background: var(--red) !important;
    border-color: var(--red) !important;
    color: #fff !important;
  }
  .option-btn:disabled { cursor: default; }

  /* Feedback */
  .feedback-card {
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    display: none;
    animation: fadeUp .3s ease;
  }
  .feedback-card.benar {
    background: rgba(62,207,122,0.08);
    border: 1px solid rgba(62,207,122,0.25);
  }
  .feedback-card.salah {
    background: rgba(240,74,94,0.08);
    border: 1px solid rgba(240,74,94,0.25);
  }
  .feedback-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feedback-card.benar .feedback-title { color: var(--green); }
  .feedback-card.salah .feedback-title { color: var(--red); }
  .feedback-analysis {
    font-size: 13px;
    line-height: 1.7;
    color: #b0b4cc;
  }

  .btn-next {
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    color: var(--accent2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 14px 32px;
    border-radius: 50px;
    cursor: pointer;
    width: 100%;
    transition: all .2s;
    display: none;
  }
  .btn-next:hover {
    background: rgba(201,168,76,0.1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESULT SCREEN ── */
  #result-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  #result-screen.active { display: flex; }

  .result-grade {
    font-family: 'Playfair Display', serif;
    font-size: 6rem;
    line-height: 1;
    margin-bottom: 8px;
  }
  .grade-A { color: var(--green); }
  .grade-B { color: #5bc4f0; }
  .grade-C { color: var(--accent2); }
  .grade-D { color: var(--red); }

  .result-label {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 32px;
  }

  .result-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .r-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 28px;
    min-width: 130px;
  }
  .r-stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    display: block;
    margin-bottom: 4px;
  }
  .r-stat-val.green { color: var(--green); }
  .r-stat-val.red   { color: var(--red); }
  .r-stat-val.gold  { color: var(--accent2); }
  .r-stat-label { font-size: 12px; color: var(--muted); }

  .result-comment {
    max-width: 420px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .btn-restart {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 32px;
    border-radius: 50px;
    cursor: pointer;
    transition: all .2s;
    margin-top: 12px;
  }
  .btn-restart:hover {
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* Review section */
  .review-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 50px;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 0;
  }
  .review-toggle:hover { border-color: var(--accent); color: var(--accent2); }

  .review-list {
    width: 100%;
    max-width: 680px;
    margin-top: 32px;
    display: none;
    text-align: left;
  }
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    border-left: 3px solid var(--border);
  }
  .review-item.benar { border-left-color: var(--green); }
  .review-item.salah { border-left-color: var(--red); }
  .review-q { font-size: 13px; line-height: 1.65; margin-bottom: 10px; white-space: pre-wrap; }
  .review-answers { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .review-answers .r-correct { color: var(--green); }
  .review-answers .r-wrong   { color: var(--red); }
  .review-analysis { font-size: 12px; line-height: 1.65; color: #8a8fa8; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  @media (max-width: 480px) {
    .question-card { padding: 20px 16px; }
    .option-btn { padding: 14px 14px; }
  }
</style>
</head>
<body>

<!-- ════════════ START SCREEN ════════════ -->
<div id="start-screen" class="screen active">
  <div class="badge">PAI · Kelas 10–12 SMA/MA</div>
  <h1>Kuis Fikih,<br>Sejarah & Aqidah</h1>
  <p class="subtitle">Uji pemahamanmu tentang Sejarah Islam Nusantara, Pergaulan Bebas, dan Al-Kulliyatu Al-Khamsah (Maqashid Syariah). Setiap jawaban dilengkapi analisis mendalam.</p>

  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-num">40</span>
      <span class="stat-label">Soal</span>
    </div>
    <div class="stat-card">
      <span class="stat-num">3</span>
      <span class="stat-label">Materi</span>
    </div>
    <div class="stat-card">
      <span class="stat-num">A–E</span>
      <span class="stat-label">Pilihan</span>
    </div>
  </div>

  <div class="soal-picker">
    <label>Berapa soal yang ingin dikerjakan?</label>
    <div class="slider-row">
      <input type="range" id="jumlah-slider" min="5" max="40" step="5" value="10">
      <span class="slider-val" id="slider-display">10</span>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setJumlah(5)">5</button>
      <button class="quick-btn" onclick="setJumlah(10)">10</button>
      <button class="quick-btn" onclick="setJumlah(20)">20</button>
      <button class="quick-btn" onclick="setJumlah(30)">30</button>
      <button class="quick-btn" onclick="setJumlah(40)">Semua</button>
    </div>
  </div>

  <button class="btn-primary" onclick="startQuiz()">Mulai Kuis →</button>
</div>

<!-- ════════════ QUIZ SCREEN ════════════ -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <div class="progress-info">
      <span class="soal-num" id="soal-num">1</span>
      <span class="soal-total" id="soal-total">/ 10</span>
    </div>
    <div class="score-badge">
      <span>✔ <b id="skor-benar">0</b></span>
      <span>✘ <span class="wrong" id="skor-salah">0</span></span>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="question-card">
    <span class="bank-tag" id="bank-tag">No. 1</span>
    <p class="question-text" id="question-text"></p>
  </div>

  <div class="options-list" id="options-list"></div>

  <div class="feedback-card" id="feedback-card">
    <div class="feedback-title" id="feedback-title"></div>
    <div class="feedback-analysis" id="feedback-analysis"></div>
  </div>

  <button class="btn-next" id="btn-next" onclick="nextSoal()">Lanjut →</button>
</div>

<!-- ════════════ RESULT SCREEN ════════════ -->
<div id="result-screen" class="screen">
  <div class="result-grade" id="result-grade"></div>
  <div class="result-label" id="result-label"></div>

  <div class="result-stats">
    <div class="r-stat">
      <span class="r-stat-val green" id="res-benar">0</span>
      <span class="r-stat-label">Benar</span>
    </div>
    <div class="r-stat">
      <span class="r-stat-val red" id="res-salah">0</span>
      <span class="r-stat-label">Salah</span>
    </div>
    <div class="r-stat">
      <span class="r-stat-val gold" id="res-nilai">0</span>
      <span class="r-stat-label">Nilai</span>
    </div>
  </div>

  <p class="result-comment" id="result-comment"></p>

  <button class="btn-primary" onclick="startQuiz()">Ulangi Kuis →</button>
  <button class="btn-restart" onclick="goHome()">Kembali ke Awal</button>
  <br><br>
  <button class="review-toggle" onclick="toggleReview()">📋 Lihat Rekap Jawaban</button>
  <div class="review-list" id="review-list"></div>
</div>

<script>
const BANK = [
  {
    no:1,
    q:"Sunan Kalijaga menggunakan kesenian wayang kulit sebagai sarana dakwah dengan mengubah isi cerita Ramayana dan Mahabharata menjadi memuat nilai-nilai Tauhid. Langkah metodologis ini dalam kacamata sosiologis dakwah menunjukkan bahwa...",
    o:["A. Islam mengeliminasi total budaya lokal yang tidak murni","B. Sinkretisme keagamaan adalah tujuan akhir dari dakwah Wali Songo","C. Ulama mengadopsi pendekatan kultural-akomodatif tanpa mengorbankan substansi akidah","D. Masyarakat Jawa menolak Islam jika tidak disajikan dalam bentuk mistisisme","E. Budaya lokal lebih dominan dari nilai-nilai syariat Islam itu sendiri"],
    j:"C",
    a:"Strategi dakwah Sunan Kalijaga menggunakan media wayang mencerminkan metode akomodasi budaya (inkulturasi/kultural-akomodatif). Budaya lokal dirangkul dan disisipkan nilai tauhid tanpa merusak esensi akidah Islam itu sendiri."
  },
  {
    no:2,
    q:"Perhatikan potret dakwah berikut: Sunan Kudus melarang penyembelihan sapi saat Idul Adha di wilayah Kudus dan menggantinya dengan kerbau. Analisis yang paling tepat terhadap strategi fatwa tersebut adalah...",
    o:["A. Memperlemah syariat Islam demi toleransi yang kebablasan","B. Sebuah strategi fikih dakwah yang mengutamakan kemaslahatan sosial dan psikologi masyarakat Hindu","C. Menunjukkan bahwa hukum menyembelih sapi adalah makruh dalam mazhab Syafii","D. Bentuk ketakutan ulama terhadap dominasi kerajaan Hindu yang berkuasa saat itu","E. Pengalihan fokus ibadah kurban dari aspek ritual ke aspek budaya"],
    j:"B",
    a:"Larangan ini didasari atas asas penghormatan terhadap masyarakat setempat yang mayoritas beragama Hindu (karena sapi disucikan dalam Hindu). Ini adalah bentuk implementasi fiqh ad-da'wah demi menjaga harmoni sosial serta menarik simpati masyarakat secara psikologis."
  },
  {
    no:3,
    q:"Manuskrip karya Syekh Nuruddin ar-Raniri dan Hamzah Fansuri di Aceh menunjukkan dinamika teologis yang menegangkan mengenai konsep Wujudiyah. Dampak positif dari perdebatan intelektual ini bagi perkembangan Islam di Nusantara adalah...",
    o:["A. Terjadinya polarisasi yang meningkatkan kekuatan militer Kesultanan Aceh","B. Lahirnya tradisi literasi, kodifikasi hukum Islam, dan penguatan nalar kritis-teologis","C. Munculnya gerakan radikalisme yang menolak otoritas sultan","D. Berhentinya proses islamisasi di wilayah luar Sumatera","E. Masuknya pengaruh kolonialis Barat yang memanfaatkan perpecahan tersebut"],
    j:"B",
    a:"Perdebatan pemikiran/teologis (antara paham Wujudiyah Hamzah Fansuri dan penentangnya seperti Nuruddin ar-Raniri) memicu produktivitas penulisan kitab, yang berdampak sangat positif terhadap tumbuh suburnya tradisi literasi, dokumentasi hukum Islam, serta mengasah nalar kritis kaum intelektual di Nusantara."

// ─── State ───
let sesi = [], idx = 0, benar = 0, salah = 0, riwayat = [];
let jumlah = 10;

// ─── Slider ───
const slider = document.getElementById('jumlah-slider');
const display = document.getElementById('slider-display');
slider.addEventListener('input', () => {
  jumlah = +slider.value;
  display.textContent = jumlah;
});
function setJumlah(n) {
  jumlah = n; slider.value = n; display.textContent = n;
}

// ─── Shuffle helper ───
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  sesi = shuffle(BANK).slice(0, jumlah);
  idx = 0; benar = 0; salah = 0; riwayat = [];
  showScreen('quiz-screen');
  renderSoal();
}

function renderSoal() {
  const s = sesi[idx];
  document.getElementById('soal-num').textContent = idx+1;
  document.getElementById('soal-total').textContent = '/ '+sesi.length;
  document.getElementById('skor-benar').textContent = benar;
  document.getElementById('skor-salah').textContent = salah;
  document.getElementById('progress-fill').style.width = (idx/sesi.length*100)+'%';
  document.getElementById('bank-tag').textContent = 'Soal No. '+s.no;
  document.getElementById('question-text').textContent = s.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  s.o.forEach(opt => {
    const key = opt[0];
    const text = opt.substring(3);
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-key">${key}</span><span class="option-text">${text}</span>`;
    btn.onclick = () => pilih(key, btn, s);
    list.appendChild(btn);
  });

  const fb = document.getElementById('feedback-card');
  fb.style.display = 'none';
  fb.className = 'feedback-card';
  document.getElementById('btn-next').style.display = 'none';
}

function pilih(key, clickedBtn, s) {
  // disable all
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  const isBenar = key === s.j;
  if (isBenar) benar++; else salah++;

  // mark buttons
  document.querySelectorAll('.option-btn').forEach(b => {
    const k = b.querySelector('.option-key').textContent;
    if (k === s.j) b.classList.add('correct');
    if (k === key && !isBenar) b.classList.add('wrong');
    if (k === key) b.classList.add('selected');
  });

  // feedback
  const fb = document.getElementById('feedback-card');
  const title = document.getElementById('feedback-title');
  const analysis = document.getElementById('feedback-analysis');
  fb.style.display = 'block';
  fb.className = 'feedback-card ' + (isBenar ? 'benar' : 'salah');
  title.innerHTML = isBenar
    ? '✔ Jawaban Benar!'
    : `✘ Salah — Jawaban benar: <strong>${s.j}</strong>`;
  analysis.textContent = s.a;

  document.getElementById('skor-benar').textContent = benar;
  document.getElementById('skor-salah').textContent = salah;

  riwayat.push({ soal: s, pilihan: key, benar: isBenar });

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  btnNext.textContent = idx+1 < sesi.length ? 'Lanjut →' : 'Lihat Hasil →';
}

function nextSoal() {
  idx++;
  if (idx < sesi.length) renderSoal();
  else showResult();
}

function showResult() {
  const nilai = Math.round(benar/sesi.length*100);
  let grade, label, comment;
  if (nilai >= 85) { grade = 'A'; label = 'Sangat Baik'; comment = 'Luar biasa! Penguasaan materimu sangat kuat. Terus pertahankan dan dalami lebih lanjut.'; }
  else if (nilai >= 70) { grade = 'B'; label = 'Baik'; comment = 'Bagus! Kamu memahami sebagian besar materi. Ulangi soal yang salah untuk hasil lebih sempurna.'; }
  else if (nilai >= 55) { grade = 'C'; label = 'Cukup'; comment = 'Kamu sudah di jalur yang benar, tapi masih perlu lebih banyak latihan dan review materi.'; }
  else { grade = 'D'; label = 'Perlu Belajar Lebih'; comment = 'Jangan menyerah! Baca kembali materi dan coba lagi. Setiap usaha adalah bagian dari perjalanan belajar.'; }

  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-grade').className = 'result-grade grade-'+grade;
  document.getElementById('result-label').textContent = label;
  document.getElementById('res-benar').textContent = benar;
  document.getElementById('res-salah').textContent = salah;
  document.getElementById('res-nilai').textContent = nilai;
  document.getElementById('result-comment').textContent = comment;

  // Build review
  const rl = document.getElementById('review-list');
  rl.innerHTML = '';
  riwayat.forEach((r,i) => {
    const div = document.createElement('div');
    div.className = 'review-item '+(r.benar?'benar':'salah');
    const jawUser = r.soal.o.find(o=>o[0]===r.pilihan) || r.pilihan;
    const jawBenar = r.soal.o.find(o=>o[0]===r.soal.j) || r.soal.j;
    div.innerHTML = `
      <div class="review-q"><strong>Soal ${i+1}</strong> (Bank No.${r.soal.no}) — ${r.soal.q}</div>
      <div class="review-answers">
        <span class="${r.benar?'r-correct':'r-wrong'}">Jawabanmu: ${jawUser}</span>
        ${!r.benar ? `<span class="r-correct">Benar: ${jawBenar}</span>` : ''}
      </div>
      <div class="review-analysis">💡 ${r.soal.a}</div>
    `;
    rl.appendChild(div);
  });
  rl.style.display = 'none';

  showScreen('result-screen');
}

function toggleReview() {
  const rl = document.getElementById('review-list');
  rl.style.display = rl.style.display === 'none' ? 'block' : 'none';
}

function goHome() { showScreen('start-screen'); }
</script>
